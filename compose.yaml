services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # the GTFS .txt files extracted from the 511 archive live here.
      # COPY reads from the server's filesystem, so they have to be visible
      # inside the container.
      - ./data:/data
    # Docker gives containers 64 MB of shared memory by default. Postgres uses
    # it for large sorts and parallel query; at 25.8M rows that default causes
    # failures that look like nothing in particular.
    shm_size: 1gb
    # deliberately no ports: — Postgres is not exposed to the internet.
    # Metabase reaches it over the internal Docker network as host "postgres".

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mbdata:/metabase-data
    depends_on:
      - postgres

volumes:
  pgdata:
  mbdata:
